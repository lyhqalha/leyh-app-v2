name: Build Leyh Qalha v38 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v38 project
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="leyh-v38-android-build-prepared.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Project ZIP not found: $ARCHIVE"
            find . -maxdepth 4 -type f -name '*.zip' || true
            exit 1
          fi

          mkdir -p /tmp/leyh-source
          unzip -q "$ARCHIVE" -d /tmp/leyh-source

          PACKAGE_FILE="$(find /tmp/leyh-source -type f -name package.json -print -quit)"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "::error::package.json was not found in the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

          "$SDKMANAGER" --licenses </dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify project files
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          test -f package.json || {
            echo "::error::package.json is missing."
            exit 1
          }

          test -f scripts/prepare_android.sh || {
            echo "::error::scripts/prepare_android.sh is missing."
            exit 1
          }

          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.js ]; then
            echo "::error::Capacitor configuration is missing."
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Verify Capacitor dependencies
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const p = require('./package.json');
          const deps = {
            ...p.dependencies,
            ...p.devDependencies
          };

          const required = [
            '@capacitor/core',
            '@capacitor/cli',
            '@capacitor/android'
          ];

          const missing = required.filter(name => !deps[name]);

          if (missing.length) {
            console.error('Missing dependencies:', missing.join(', '));
            process.exit(1);
          }

          console.log('Capacitor dependencies verified.');
          NODE

      - name: Build web application
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Add Android platform if needed
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android platform already exists."
          fi

      - name: Sync Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Prepare Android resources and offline TTS
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: bash scripts/prepare_android.sh

      - name: Verify Gradle wrapper
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -euo pipefail

          if [ ! -f gradlew ]; then
            echo "::error::Gradle wrapper is missing."
            exit 1
          fi

          chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated."
            find app/build/outputs -type f -name '*.apk' || true
            exit 1
          fi

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: leyh-qalha-v38-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
